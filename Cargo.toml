[package]
name = "ask-opencode"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skim = { version = "5.6.3", default-features = false }
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[profile.dev]
debug = true

[profile.dev.package."*"]
debug = false
